<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="roomGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b33" />
      <stop offset="100%" style="stop-color:#1a0f1f" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#roomGrad3)" />
  <!-- Floor -->
  <rect x="0" y="240" width="400" height="40" fill="#120a17" />
  <!-- Large windows - right side -->
  <rect x="260" y="0" width="140" height="240" fill="#1e3a5f" opacity="0.5" />
  <line x1="330" y1="0" x2="330" y2="240" stroke="#8b7355" stroke-width="3" />
  <line x1="260" y1="80" x2="400" y2="80" stroke="#8b7355" stroke-width="2" />
  <line x1="260" y1="160" x2="400" y2="160" stroke="#8b7355" stroke-width="2" />
  <!-- Window light effect -->
  <polygon points="260,0 400,0 400,240 260,240" fill="#87ceeb" opacity="0.06" />
  <!-- Pendant lights -->
  <line x1="100" y1="0" x2="100" y2="30" stroke="#888" stroke-width="1" />
  <circle cx="100" cy="35" r="8" fill="#f5d060" opacity="0.9" />
  <line x1="200" y1="0" x2="200" y2="30" stroke="#888" stroke-width="1" />
  <circle cx="200" cy="35" r="8" fill="#f5d060" opacity="0.9" />
  <!-- Long boardroom table -->
  <rect x="30" y="160" width="220" height="15" fill="#6b4c11" rx="2" />
  <rect x="30" y="163" width="220" height="9" fill="#8b6914" rx="1" />
  <!-- Table legs -->
  <rect x="45" y="175" width="6" height="40" fill="#5a3d0a" />
  <rect x="235" y="175" width="6" height="40" fill="#5a3d0a" />
  <!-- Chairs - boardroom style -->
  <rect x="35" y="140" width="28" height="18" fill="#4a235a" rx="2" />
  <rect x="80" y="135" width="28" height="18" fill="#4a235a" rx="2" />
  <rect x="130" y="133" width="28" height="18" fill="#4a235a" rx="2" />
  <rect x="180" y="133" width="28" height="18" fill="#4a235a" rx="2" />
  <rect x="225" y="135" width="28" height="18" fill="#4a235a" rx="2" />
  <!-- Chairs opposite side -->
  <rect x="35" y="178" width="28" height="18" fill="#4a235a" rx="2" />
  <rect x="80" y="178" width="28" height="18" fill="#4a235a" rx="2" />
  <rect x="130" y="178" width="28" height="18" fill="#4a235a" rx="2" />
  <rect x="180" y="178" width="28" height="18" fill="#4a235a" rx="2" />
  <rect x="225" y="178" width="28" height="18" fill="#4a235a" rx="2" />
  <!-- Side credenza/shelf -->
  <rect x="0" y="100" width="25" height="140" fill="#3d2b1f" />
  <!-- Plant on credenza -->
  <rect x="2" y="85" width="20" height="15" fill="#5c4a2a" rx="1" />
  <ellipse cx="12" cy="80" rx="15" ry="20" fill="#2d5a1b" opacity="0.9" />
  <ellipse cx="20" cy="75" rx="10" ry="15" fill="#3a7a25" opacity="0.8" />
  <!-- Screen/TV on wall -->
  <rect x="30" y="15" width="220" height="120" fill="#111" rx="4" />
  <rect x="33" y="18" width="214" height="114" fill="#1a1a1a" />
  <rect x="35" y="20" width="210" height="110" fill="#0a0a2e" opacity="0.8" />
  <!-- Screen content - dashboard look -->
  <rect x="45" y="30" width="80" height="5" fill="#ed5565" opacity="0.7" rx="1" />
  <rect x="45" y="42" width="190" height="3" fill="#4a90d9" opacity="0.5" rx="1" />
  <rect x="45" y="50" width="150" height="3" fill="#4a90d9" opacity="0.4" rx="1" />
  <rect x="45" y="65" width="60" height="40" fill="#1e3a5f" rx="2" />
  <rect x="115" y="65" width="60" height="40" fill="#1e3a5f" rx="2" />
  <rect x="185" y="65" width="50" height="40" fill="#1e3a5f" rx="2" />
</svg>
